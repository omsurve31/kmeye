name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: make lint-backend
      - run: make test-backend
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make lint-frontend
      - run: make test-frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build and start both containers
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test the backend and the frontend proxy
        run: |
          curl --fail --silent http://localhost:8000/api/health
          curl --fail --silent http://localhost:8080/api/health
      - name: Stop containers
        if: always()
        run: docker compose down
