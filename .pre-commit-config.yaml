repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: identity-check
        name: neutral git identity and no blocked personal strings
        entry: python scripts/check_identity.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-lint
        name: ruff lint
        entry: bash -c 'cd backend && python -m ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && python -m ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: full-check
        name: make check (lint, types, tests, coverage)
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
